<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Have Crush On You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>

    <main class="content confession">
        <p class="small-text">Happy Crush Day ♡</p>

        <div class="image-box">
            <img src="images/confession.jpg" alt="Manga couple">
        </div>

        <h1>I HAVE CRUSH ON YOU</h1>
        <p class="question">Aku Menyukaimu,<br>Maukah Jadi Pasanganku?</p>

        <div class="buttons">
            <a class="btn" href="ending.html">Mau</a>
            <button class="btn" id="noBtn">Gak Mau</button>
        </div>
    </main>

    <script>
        const noBtn = document.getElementById("noBtn");

        noBtn.addEventListener("mouseenter", () => {
            const x = Math.random() * 180 - 90;
            const y = Math.random() * 100 - 50;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
